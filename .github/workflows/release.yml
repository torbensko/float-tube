name: Release

# Tag a commit to cut a release:  git tag v1.0.1 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    # Secrets are lifted into env because the `secrets` context is NOT
    # available in step-level `if:` conditions — testing it there silently
    # evaluates false and skips signing without failing the build.
    env:
      MACOS_CERT_P12_BASE64:     ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD:       ${{ secrets.MACOS_CERT_PASSWORD }}
      CODESIGN_IDENTITY:         ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID:       ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID:    ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      # Signing and notarisation are optional. With no secrets the job still
      # produces a working ad-hoc DMG; it just trips Gatekeeper for anyone
      # who downloads it.
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (universal)
        env:
          UNIVERSAL: '1'
        run: ./build.sh

      - name: Package DMG
        run: ./tools/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Notarise and staple
        if: env.MACOS_NOTARY_KEY_P8_BASE64 != ''
        run: |
          echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit build/FloatTube.dmg \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple build/FloatTube.dmg
          rm -f "$RUNNER_TEMP/notary.p8"
          # Prove a downloader will actually be allowed to open it.
          spctl -a -t open --context context:primary-signature -vv build/FloatTube.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/FloatTube.dmg \
            --title "FloatTube $GITHUB_REF_NAME" \
            --generate-notes
