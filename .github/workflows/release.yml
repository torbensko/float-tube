name: Release

# Tag a commit to cut a release:  git tag v1.0.1 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    # Same secret names as blint-agentic and brainstorm, so the same values
    # work here with nothing new to create. Lifted into env because the
    # `secrets` context is not available in step-level `if:` conditions.
    env:
      CERTIFICATE_P12:      ${{ secrets.CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      APPLE_ID:             ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD:    ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # Signing is optional: with no secrets the build still yields a working
      # ad-hoc DMG, it just trips Gatekeeper on other people's machines.
      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$CERTIFICATE_P12" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Derive the identity rather than storing it as a sixth secret.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | awk -F'"' '{print $2}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$P12_PATH"

      - name: Build (universal) and package DMG
        env:
          UNIVERSAL: '1'
        run: |
          ./build.sh
          ./tools/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Notarise and staple
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit build/FloatTube.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple build/FloatTube.dmg
          # Prove a downloader will actually be allowed to open it.
          spctl -a -t open --context context:primary-signature -vv build/FloatTube.dmg

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FloatTube ${{ github.ref_name }}
          files: build/FloatTube.dmg
          generate_release_notes: true
