name: Release

# Version-file driven, matching blint-agentic: bump VERSION and push. The gate
# below skips anything already released, so a re-run is harmless.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap Linux gate, so macOS minutes are only spent on a real release.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should-release: ${{ steps.version.outputs.should-release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-latest

    # Same secret names as blint-agentic and brainstorm, so the same values
    # work here. Lifted into env because the `secrets` context is not
    # available in step-level `if:` conditions.
    env:
      CERTIFICATE_P12:      ${{ secrets.CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      APPLE_ID:             ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD:    ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # Signing is optional: with no secrets the build still yields a working
      # ad-hoc DMG, it just trips Gatekeeper on other people's machines.
      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          # tr strips any stray whitespace/newlines the secret picked up when
          # it was pasted; those alone can corrupt the decode.
          printf '%s' "$CERTIFICATE_P12" | tr -d '[:space:]' | base64 --decode > "$P12_PATH"
          echo "decoded $(wc -c < "$P12_PATH") bytes, type: $(file -b "$P12_PATH")"
          # A PKCS#12 is DER and must start 30 82. Report before failing, since
          # "Unknown format in import" alone says nothing about the cause.
          MAGIC="$(xxd -p -l 2 "$P12_PATH")"
          if [ "$MAGIC" != "3082" ]; then
            echo "::error::CERTIFICATE_P12 does not decode to a PKCS#12 file (starts with $MAGIC, expected 3082). Re-set it with: base64 -i YourCert.p12 | gh secret set CERTIFICATE_P12"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Derive the identity rather than storing it as a sixth secret.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | awk -F'"' '{print $2}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$P12_PATH"

      - name: Build (universal) and package DMG
        env:
          UNIVERSAL: '1'
        run: |
          ./build.sh
          ./tools/make-dmg.sh "${{ needs.check-version.outputs.version }}"

      - name: Notarise and staple
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit build/FloatTube.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple build/FloatTube.dmg
          # Prove a downloader will actually be allowed to open it.
          spctl -a -t open --context context:primary-signature -vv build/FloatTube.dmg

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      # Creates the tag at this commit as part of publishing, so the tag can
      # never disagree with the VERSION that produced the build.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: FloatTube ${{ needs.check-version.outputs.version }}
          files: build/FloatTube.dmg
          generate_release_notes: true
